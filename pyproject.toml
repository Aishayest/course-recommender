[project]
name = "course-recommender"
version = "0.1.0"
description = "Рекомендательная система выбора университетских курсов"
requires-python = ">=3.12"
dependencies = [
    "numpy>=2.0",
    "pandas>=2.2",
    "scikit-learn>=1.5",
    "lightgbm>=4.5",
    "pydantic>=2.9",
]

[project.optional-dependencies]
embeddings = [
    "sentence-transformers>=3.0",
    "hnswlib>=0.8",
]
dev = [
    "pytest>=8.3",
    "ruff>=0.7",
    "jupyter>=1.1",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/course_recommender"]

[tool.ruff]
line-length = 100

[tool.pytest.ini_options]
testpaths = ["tests"]
